[package]
name = "rget"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["rustls-tls", "stream", "json", "blocking"] }
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
anyhow = "1.0"
thiserror = "1.0"
env_logger = "0.11"
url = "2.5"
rand = "0.8"
sha2 = "0.10"
digest = "0.10"
